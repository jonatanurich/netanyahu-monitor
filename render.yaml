services:
  - type: web
    name: netanyahu-media-monitor
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 main:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: monitor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: WHATSAPP_DRY_RUN
        value: false
      - key: SCAN_INTERVAL_SECONDS
        value: 90
      - key: X_ENABLED
        value: false
      - key: SEND_STARTUP_MESSAGE
        value: true
      - key: HOURLY_SUMMARY_ENABLED
        value: true
      - key: DAILY_SUMMARY_ENABLED
        value: true
      - key: ULTRA_ID
        value: instance186865
      - key: ULTRA_TOKEN
        value: ih8jz0qoxrc166a0
      - key: GROUP_ID
        value: 120363429023395450@g.us
